name: release

# 打了 v* 的 tag 之后自动触发：
#   编译 RF_Uart / RF_UartDongle 两个正式固件，外加 RF_TEST 射频测试固件（应用频段三个频点）
#   → 产出 <固件名>_<版本号>.hex
#   → 创建（或更新）对应版本的 Release，并自动成为 Latest
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（如 v0.1.1）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建固件并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含工具链子模块）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          # 发布说明与 Release 标题都要读 tag 注解（annotated tag），显式把 tag 取全
          fetch-tags: true

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # tag 不存在就直接失败 —— 免得 workflow_dispatch 手抖填错版本号后一路跑到发布才报错
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::仓库里没有 tag「${TAG}」，请确认输入与已推送的 tag 完全一致（例：v0.3.0）"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "版本号: ${TAG}"

      - name: 校验工具链
        run: tools/toolchain/bin/riscv-wch-elf-gcc --version

      - name: 编译从机 RF_Uart
        run: |
          set -euo pipefail
          cmake -B RF_Uart/build -S RF_Uart -G "Unix Makefiles"
          cmake --build RF_Uart/build -j"$(nproc)" 2>&1 | tee RF_Uart_build.log

      - name: 编译主机 RF_UartDongle
        run: |
          set -euo pipefail
          cmake -B RF_UartDongle/build -S RF_UartDongle -G "Unix Makefiles"
          cmake --build RF_UartDongle/build -j"$(nproc)" 2>&1 | tee RF_UartDongle_build.log

      - name: 编译射频测试固件 RF_TEST（应用频段三个频点）
        run: |
          set -euo pipefail
          # 定频信道号 → 频率：36 → 2474 MHz、37 → 2476 MHz、38 → 2478 MHz
          # 正好对应应用频段 CH_HOP_TBL = {74,76,78}（见 RF_TEST/APP/include/rf_test.h）
          for CH in 36 37 38; do
            cmake -B "RF_TEST/build_${CH}" -S RF_TEST -G "Unix Makefiles" -DRFTEST_DEF_CHANNEL="${CH}"
            cmake --build "RF_TEST/build_${CH}" -j"$(nproc)" 2>&1 | tee "RF_TEST_build_ch${CH}.log"
          done

      - name: 收集固件（<固件名>_<版本号>.hex）
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp RF_Uart/build/RF_Uart.hex             "dist/RF_Uart_${TAG}.hex"
          cp RF_UartDongle/build/RF_UartDongle.hex "dist/RF_UartDongle_${TAG}.hex"
          cp RF_TEST/build_36/RF_TEST.hex          "dist/RF_TEST_2474M_ch36_${TAG}.hex"
          cp RF_TEST/build_37/RF_TEST.hex          "dist/RF_TEST_2476M_ch37_${TAG}.hex"
          cp RF_TEST/build_38/RF_TEST.hex          "dist/RF_TEST_2478M_ch38_${TAG}.hex"
          ls -l dist/

      - name: 生成发布说明
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 把 tag 注解（annotated tag）并进发布说明放在最前面。
          # 打 tag 时用 `git tag -a vX.Y.Z -F notes.md --cleanup=verbatim` 写好 changelog，
          # 这样 Release 页就能直接看到"相对上一版增加了什么"。
          # 轻量 tag 没有注解（%(contents) 只会回一个 tag 名），这里自动跳过。
          # 注意：`git tag -F` 默认按 `--cleanup=strip` 处理，## 开头的行会被当注释删掉，
          # 所以务必显式带上 --cleanup=verbatim。
          TAG_TYPE="$(git for-each-ref "refs/tags/${TAG}" --format='%(objecttype)' 2>/dev/null || true)"
          TAG_NOTES=""
          if [ "${TAG_TYPE}" = "tag" ]; then
            TAG_NOTES="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)' 2>/dev/null || true)"
          else
            echo "警告：${TAG} 不是 annotated tag（objecttype=${TAG_TYPE}），发布说明将不含 tag 注解"
          fi
          {
            if [ -n "${TAG_NOTES}" ]; then
              printf '%s\n\n---\n\n' "${TAG_NOTES}"
            fi
            echo "## 固件"
            echo ""
            echo "| 文件 | 角色 | 烧写目标 |"
            echo "| --- | --- | --- |"
            echo "| \`RF_Uart_${TAG}.hex\` | 从机（接被调试设备） | CH570Q 从机板 |"
            echo "| \`RF_UartDongle_${TAG}.hex\` | 主机（插电脑 USB） | CH570Q Dongle |"
            echo "| \`RF_TEST_2474M_ch36_${TAG}.hex\` | 射频测试固件（定频 2474 MHz） | 任意 CH570Q 板 \\* |"
            echo "| \`RF_TEST_2476M_ch37_${TAG}.hex\` | 射频测试固件（定频 2476 MHz） | 任意 CH570Q 板 \\* |"
            echo "| \`RF_TEST_2478M_ch38_${TAG}.hex\` | 射频测试固件（定频 2478 MHz） | 任意 CH570Q 板 \\* |"
            echo ""
            echo "\\* **RF_TEST 是测试固件，会覆盖板上的正常固件**：上电即定频发射（LED 先闪 1/2/3 次标识频点，随后常亮），配合频谱仪/综测仪测载波频率与功率。三个频点对应应用频段 \`CH_HOP_TBL = {74,76,78}\`。**测完请把从机/主机固件烧回去**，用法见 [RF_TEST/README.md](https://github.com/${REPO}/blob/${TAG}/RF_TEST/README.md)。"
            echo ""
            echo "## 资源占用"
            echo ""
            echo '```'
            echo "# RF_Uart（从机）"
            sed -n '/Memory region/,/RAM:/p' RF_Uart_build.log | head -3
            echo ""
            echo "# RF_UartDongle（主机）"
            sed -n '/Memory region/,/RAM:/p' RF_UartDongle_build.log | head -3
            echo ""
            echo "# RF_TEST（射频测试固件）"
            sed -n '/Memory region/,/RAM:/p' RF_TEST_build_ch37.log | head -3
            echo '```'
            echo ""
            echo "## 烧写"
            echo ""
            echo "两颗芯片都是 **CH570Q**，用 WCH-Link 通过两线调试口烧写。**两个正式固件都要烧，别烧错**：主机烧 \`RF_UartDongle_*\`，从机烧 \`RF_Uart_*\`。"
            echo ""
            echo "- 从机固件运行时会关闭两线调试功能（腾出引脚给串口），下载失败时先给板子断电重上电；"
            echo "- 接线、配对与上位机使用说明见 [README](https://github.com/${REPO}/blob/${TAG}/README.md)。"
            echo ""
            echo "## 本次提交"
            echo ""
            echo "https://github.com/${REPO}/commit/${SHA}"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          # ---- 产物自检：缺任何一个就当场失败，并把 dist/ 实际内容打出来 ----
          FILES=(
            "RF_Uart_${TAG}.hex"
            "RF_UartDongle_${TAG}.hex"
            "RF_TEST_2474M_ch36_${TAG}.hex"
            "RF_TEST_2476M_ch37_${TAG}.hex"
            "RF_TEST_2478M_ch38_${TAG}.hex"
          )
          echo "== dist/ 内容 =="
          ls -l dist/
          PATHS=()
          MISSING=0
          for f in "${FILES[@]}"; do
            [ -s "dist/$f" ] || { echo "::error::缺少产物 dist/$f"; MISSING=1; }
            PATHS+=("dist/$f")
          done
          [ "${MISSING}" -eq 0 ] || { echo "产物不全，终止发布"; exit 1; }

          # ---- 标题：优先用 tag 注解的首行，不要用干巴巴的「$TAG」----
          # annotated tag 的 %(contents:subject) 就是注解首行；轻量 tag 取不到就退回 $TAG。
          TITLE="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)' 2>/dev/null || true)"
          [ -n "${TITLE}" ] || TITLE="${TAG}"
          echo "Release 标题: ${TITLE}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：更新产物与说明"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,url | cat

            # immutable（不可变发布）之后不能再补资产 —— 提前识别，给出可执行的处置办法，
            # 而不是让 gh 抛一句看不懂的错。
            IMMUTABLE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                          --json isImmutable -q '.isImmutable' 2>/dev/null || echo '')"
            if [ "${IMMUTABLE}" = "true" ]; then
              echo "::error::Release ${TAG} 是 immutable（不可变发布），无法再上传固件。"
              echo "  处置二选一："
              echo "   ① 仓库 Settings → General → Releases 关掉「Immutable releases」后重跑本工作流；"
              echo "   ② 删掉该 Release（tag 保留），再重跑本工作流让它重新创建。"
              exit 1
            fi

            if ! gh release upload "$TAG" "${PATHS[@]}" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "::error::gh release upload 失败（退出码 $?）"
              echo "  常见原因：① Release 为 immutable；② Token 缺 contents:write；③ 资产名冲突/被锁定"
              echo "  排查：gh release view ${TAG} --repo ${GITHUB_REPOSITORY}"
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "${TITLE}" --notes-file RELEASE_NOTES.md
          else
            echo "创建 Release $TAG"
            if ! gh release create "$TAG" "${PATHS[@]}" --repo "$GITHUB_REPOSITORY" \
                 --title "${TITLE}" --notes-file RELEASE_NOTES.md; then
              echo "::error::gh release create 失败（退出码 $?）"
              echo "  排查：gh release view ${TAG} --repo ${GITHUB_REPOSITORY}"
              exit 1
            fi
          fi

          echo "== 发布完成，当前 Release 资产 =="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | cat
