# Gitee Go 流水线：把 GitHub Release 已构建好的固件同步到 Gitee 发行版
#
# Gitee 侧**不编译**。代码是从 GitHub 镜像过来的，同一份源码编出来的东西必然一样，
# 而在这儿重编要拖 2.2 GB 的 tools/toolchain 子模块、吃光免费构建额度；固件总共
# 才 ~180 KB，直接搬运划算得多。编译仍然只发生在 GitHub Actions（release.yml）。
#
# 怎么被触发（三条路，任选其一即可）：
#   ① GitHub 发完 Release 后自动触发 —— release.yml 末尾会装 Gitee CLI 并执行
#      `gitee pipeline run -R seahi007/Seahi-Serial-AirTTL --ref master --file sync-release.yml`
#   ② 手动：Gitee 仓库 → 流水线 → 这条流水线 → 运行
#   ③ 定时兜底：可选，默认没开。Gitee 手写 cron 容易判「表达式无效」，要加请走
#      可视化界面（见文件末尾 triggers 处的说明）。
#
# 【前提】这条流水线自己的 yml 得先在 Gitee 的 master 上（也就是仓库至少同步过一次）；
#        脚本要建的是「某个 tag 的发行版」，所以那个 tag / 它指向的 commit 也得已经在
#        Gitee 仓库里。触发时 Gitee 还没同步到的话，脚本会明确报出来，同步后重跑即可。
#
# 【令牌】SYNC_TOKEN 不写在仓库里，在 Gitee 的「流水线 → 变量」里配：
#        变量名 SYNC_TOKEN，值填 Gitee 私人令牌（设置 → 私人令牌，勾 projects 权限）。
#        注意 Gitee 的流水线变量在命令里是文本替换，日志里可能看得到 —— 建议专门
#        建一个只用来发版的令牌，别用全权限的。
version: '1.0'

name: sync-release
displayName: 同步固件到 Gitee 发行版

strategy:
  # 上一次没跑完就让新的排队，别并发去 GitHub 拉同一份东西
  blocking: true
  stepTimeout: 30

# 【定时触发（可选，默认没开）】
# 原来这里写过 `schedule: - cron: '0 3 * * ?'`，Gitee 判「定时任务表达式无效」。
# 官方文档给的格式是 `M H D m d y`（示例 '0 */2 * * ?'），和上面那串同构 —— 校验不过，
# 估计这节和「任务编排」页一样是旧版遗留，实际解析器未必认 `?`。
# 要加定时就别手写 cron：去 Gitee 的流水线 → 定时触发可视化界面里配，
# 保存时它会回写一条校验通过的表达式到本文件。
#
# 不加也不影响主链路：GitHub 发完版会主动触发本流水线；万一漏了，到 Gitee
# 页面点一次「运行」即可 —— 脚本是幂等的，重复跑不会留重复附件。

variables:
  # 【命名】前缀**不要**用 GITEE_ 或 GO_ —— 那是 Gitee Go 的系统保留字。
  #   实测踩过：GITEE_REPO 是内置参数（值就是 `owner/repo`），会覆盖这里配的值，
  #   脚本拿到的是 "seahi007/Seahi-Serial-AirTTL" 而不是仓库名，当即出错。
  #   同理 Gitee 界面上配令牌时变量名也得避开这个前缀，所以这里统一用 SYNC_。
  # Gitee 侧仓库（发到哪儿）
  SYNC_OWNER: seahi007
  SYNC_REPO: Seahi-Serial-AirTTL
  # GitHub 侧仓库（固件从哪儿来）
  GH_REPO: SeaHi-Mo/Seahi-Serial-AirTTL

stages:
  - name: sync
    displayName: 同步发行版
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      # 用 build@gcc 只是因为它提供一台带 git/curl/jq 的 Ubuntu 构建机 ——
      # 社区版的云端插件里没有更通用的「跑一段 shell」的选项。
      - step: build@gcc
        name: sync_release
        displayName: 从 GitHub 下载固件并发布到 Gitee 发行版
        gccVersion: '10.3'
        commands: |
          set -e
          # Gitee 的流水线变量是文本替换，得在这里显式转成环境变量给脚本用
          export SYNC_OWNER="${SYNC_OWNER}"
          export SYNC_REPO="${SYNC_REPO}"
          export GH_REPO="${GH_REPO}"
          # 令牌是敏感值：Gitee 的插件默认开了 set -x，替换后的真值会被 trace 打进
          # 构建日志，这里先关掉回显再导出（尽力而为，仍建议用最小权限令牌 + 定期轮换）
          set +x
          export SYNC_TOKEN="${SYNC_TOKEN}"
          # GitHub 触发时会用 -p TAG=vX.Y.Z 把版本号带过来；手动运行或没带上就是空值，
          # 脚本会自动去查 GitHub 的最新 Release（:- 是防未定义时被 set -u 拦下）
          export TAG="${TAG:-}"
          bash tools/ci/sync-gitee-release.sh
