# Gitee Go 编译流水线
#
# 职责：push 到 master、向 master 提 PR 时，编译全部固件，确认「代码能编过」，
#       并把 hex 暂存成构建产物（Gitee 构建页可直接下载，保留 7 天）。
#
# 与 GitHub 侧的分工：
#   .github/workflows/release.yml   打 v* tag 时编译 + 发 GitHub Release（对外发版本走这条）
#   .workflow/build.yml（本文件）   平时的编译校验（Gitee 侧，不发版）
#
# 【额度提醒】Gitee Go 免费额度为「本仓库 200 分钟 + 每月 500 分钟」，而每次构建都要
# 拉取 tools/toolchain 这个约 2.2 GB 的子模块。若构建过于频繁，额度会很快见底：
#   - 想省额度就把下面的精确匹配改成只在 master 上触发、或只在 PR 上触发；
#   - 想省时间就参见文件末尾「工具链加速」一节的说明。
#
# 本文件由人工维护，也可在 Gitee 仓库的「流水线 → 代码视图」里直接编辑（两边内容一致）。
version: '1.0'

# 流水线唯一标识（同一仓库内不可重复），界面上显示的是 displayName
name: build
displayName: 编译固件

# 顶层策略（不是阶段里的那个 strategy）：
#   blocking=true    上一次构建没跑完时，新的提交先排队，不并发 —— 免得并发拉两份工具链把额度烧掉
#   stepTimeout=60   单个任务超过 60 分钟判定超时（首次拉工具链耗时较长，别设太小）
strategy:
  blocking: true
  stepTimeout: 60

triggers:
  # 提交到 master 触发
  push:
    branches:
      precise:
        - master
  # 向 master 提 PR 触发（含 PR 更新）
  pr:
    branches:
      precise:
        - master

stages:
  - stage:
      name: build
      displayName: 编译
      # naturally：失败只影响自己这条链，不做快速失败（这里本来也只有一条链）
      strategy: naturally
      trigger: auto
      steps:
        # build@gcc 的基础镜像是 Ubuntu 20.04，自带 git / wget / zip 等常规工具。
        # gccVersion 只是宿主自带的 GCC（用于跑 cmake/make 本身），
        # 真正的交叉编译器是仓库内 tools/toolchain 里沁恒定制的 riscv-wch-elf-gcc。
        - step: build@gcc
          name: build_firmware
          displayName: 编译 RF_Uart / RF_UartDongle / RF_TEST
          gccVersion: '10.3'
          commands: |
            set -e
            # 编译逻辑全在脚本里，本地和 CI 共用同一份，见 tools/ci/build-all.sh
            bash tools/ci/build-all.sh
          # 暂存构建产物（7 天后自动清除；不会进制品库）
          artifacts:
            - name: FIRMWARE
              path:
                - ./dist

# ---------------------------------------------------------------------------
# 工具链加速（可选，不改也能跑）
#
# tools/toolchain 是约 2.2 GB 的子模块，地址写在 .gitmodules 里，指向 GitHub。
# Gitee 的构建机直接拉 GitHub 可能很慢甚至失败，届时按下面任一种方式处理：
#
#   ① 换成国内镜像（最省事）
#      在 Gitee 的「流水线 → 变量」里加一个流水线变量：
#          TOOLCHAIN_URL = <工具链在 Gitee/GitLab 等处的仓库地址>
#      tools/ci/build-all.sh 检测到该变量后会用 git clone --depth 1 拉它，
#      不再走 .gitmodules。变量留空或不存在时维持原行为。
#
#   ② 用 Gitee 的「构建缓存」
#      若当前套餐的 GCC 构建表单里有「构建缓存」项，把 tools/toolchain 填进去，
#      后续构建从缓存解压，省掉每次拉取。
#
# 注意：工具链必须是沁恒定制的 riscv-wch-elf GCC 12.2.0，普通 RISC-V 工具链
#       不支持 -march 里的 xw 扩展（mcpy 等自定义指令），换了编不过。
# ---------------------------------------------------------------------------
